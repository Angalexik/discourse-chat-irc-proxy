[package]
name = "ghffdsa"
version = "0.0.1"
edition = "2024"

[dependencies]
color-eyre = "0.6.5"
confy = "2.0.0"
futures = "0.3.32"
irc = "1.1.0"
phf = { version = "0.14.0" }
pin-project = "1.1.13"
rand = "0.10.2"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["json", "cookies", "form", "stream", "query"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
strum = { version = "0.28.0", features = ["derive", "strum_macros"] }
thiserror = "2.0.20"
time = { version = "0.3.53", features = ["formatting"] }
tokio = { version = "1", features = ["rt", "net", "macros"] }
tokio-stream = "0.1.18"
tokio-util = { version = "0.7.18", features = ["codec", "io"] }
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
httpmock = "0.8.3"

[build-dependencies]
nom = "8.0.0"
phf = { version = "0.14.0", default-features = false }
phf_codegen = "0.14.0"
