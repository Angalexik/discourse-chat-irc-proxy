[package]
name = "ghffdsa"
version = "0.0.1"
edition = "2024"

[dependencies]
color-eyre = "0.6.5"
confy = "2.0.0"
futures = "0.3.32"
irc = "1.1.0"
pin-project = "1.1.13"
rand = "0.10.2"
reqwest = { version = "0.13.4", features = ["json", "cookies", "form", "stream", "query"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
time = { version = "0.3.53", features = ["formatting"] }
tokio = { version = "1", features = ["rt", "net", "macros"] }
tokio-stream = "0.1.18"
tokio-util = { version = "0.7.18", features = ["codec", "io"] }
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
httpmock = "0.8.3"
